version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: launchops-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host 5433 -> container 5432 (Postgres's own default port never changes
      # inside the container; only the host-side mapping is non-default).
      - "${POSTGRES_PORT}:5432"
    volumes:
      - launchops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  launchops_pgdata:
    name: launchops_pgdata
